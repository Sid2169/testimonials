services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: testimonials
      MYSQL_USER: testimonials
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [private]

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_USER: testimonials
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: testimonials
      PUBLIC_ORIGIN: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env}
      ADMIN_ORIGIN: https://${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in .env}
      TRUST_PROXY_HOPS: 1
      UPLOAD_DIR: /app/uploads
    volumes: ["uploads:/app/uploads"]
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  website:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        APP: website
        VITE_ADMIN_URL: https://${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in .env}
    restart: unless-stopped
    networks: [private]

  admin:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        APP: admin
        VITE_WEBSITE_URL: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env}
    restart: unless-stopped
    networks: [private]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, website, admin]
    networks: [private, edge]

networks:
  private:
    internal: true
  edge:
volumes:
  mysql_data:
  uploads:
  caddy_data:
  caddy_config:
