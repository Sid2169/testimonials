services:
  - type: web
    name: siddhartha-testimonials-api
    runtime: node
    plan: free
    # NODE_ENV=production is available during builds, so explicitly retain the
    # TypeScript compiler and declaration packages needed to produce dist/.
    buildCommand: npm ci --include=dev && npm run build -w @testimonials/api
    startCommand: npm run start -w @testimonials/api
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.20.0
      - key: DB_SSL
        value: "true"
      - key: STORAGE_DRIVER
        value: s3
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: ADMIN_ORIGIN
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
