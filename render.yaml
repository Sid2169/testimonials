# Render "Blueprint": declarative service definition that Render reads to
# build/refresh the API service. Variables marked `sync: false` are secrets or
# environment-specific values Render prompts for in its dashboard (and keeps
# out of this file). See docs/PRODUCTION_DEPLOYMENT.md for the exact values.
services:
  - type: web
    name: siddhartha-testimonials-api
    runtime: node
    plan: free
    # NODE_ENV=production is available during builds, so explicitly retain the
    # TypeScript compiler and declaration packages needed to produce dist/.
    buildCommand: npm ci --include=dev && npm run build -w @testimonials/api
    startCommand: npm run start -w @testimonials/api
    healthCheckPath: /api/health
    # Redeploys automatically on every push to the production branch.
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.20.0
      - key: DB_SSL
        value: "true" # TiDB Cloud requires TLS.
      - key: STORAGE_DRIVER
        value: s3 # Photos go to Backblaze B2 via its S3 interface.
      - key: TRUST_PROXY_HOPS
        value: "1" # Render's router sits one hop in front of the service.
      # The rest are entered in the Render dashboard (sync: false = not stored
      # here): database credentials + both public/admin origins + the S3 keys.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: ADMIN_ORIGIN
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false